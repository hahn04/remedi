<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title description">
  <title id="title">같은 얼굴, 다른 좌우 방향</title>
  <desc id="description">같은 얼굴 그림을 좌우로 반전한 비교. 볼의 색 점과 턱끝의 방향이 함께 반대편으로 이동한다. 실제 환자나 치료 전후가 아닌 설명용 그림.</desc>
  <defs>
    <g id="face" stroke="#596a5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-103,-72 C-114,-149 -74,-194 0,-194 C84,-194 116,-140 103,-65 L97,17 C93,70 54,102 16,126 C-20,132 -76,87 -92,34 Z" fill="#eee9df"/>
      <path d="M-103,-72 C-102,-163 -66,-184 0,-184 C61,-184 101,-148 103,-65 C74,-108 49,-137 35,-149 C0,-112 -55,-96 -103,-72Z" fill="#b6bdac" stroke="none"/>
      <path d="M-70,-32 Q-47,-45 -25,-32 M24,-39 Q47,-49 70,-36" fill="none"/>
      <path d="M-63,-14 Q-47,-5 -31,-14 M31,-18 Q47,-10 63,-18" fill="none"/>
      <path d="M3,-24 L-5,31 Q1,39 13,33 M-29,66 Q4,78 35,61" fill="none"/>
      <circle cx="-62" cy="28" r="11" fill="#ba815b" stroke="none"/>
    </g>
  </defs>
  <rect width="1120" height="620" fill="#f0f2ec"/>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#334b3b">
    <text x="560" y="60" font-size="24">같은 얼굴, 다른 좌우 방향</text>
    <text x="295" y="115" font-size="19">원래 방향</text>
    <text x="825" y="115" font-size="19">좌우 반전</text>
    <use href="#face" transform="translate(295 347)"/>
    <use href="#face" transform="translate(825 347) scale(-1 1)"/>
    <path d="M295,146 V490 M825,146 V490" stroke="#a2afa0" stroke-width="2" stroke-dasharray="5 8" opacity=".75"/>
    <path d="M509,319 H611 M509,319 L521,310 M509,319 L521,328 M611,319 L599,310 M611,319 L599,328" stroke="#82917c" stroke-width="2" fill="none"/>
    <text x="560" y="350" font-size="14" fill="#6c7867">좌우만 반전</text>
    <text x="295" y="526" font-size="18">표시와 턱끝의 방향을 보세요</text>
    <text x="825" y="526" font-size="18">같은 특징이 반대편에 보입니다</text>
    <text x="560" y="582" font-size="15" fill="#78806f">re:medi · 형태를 설명하기 위한 도식</text>
  </g>
